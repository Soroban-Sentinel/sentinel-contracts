# Soroban Sentinel configuration file.
# Example input for Sentinel tooling; the current CI does not run this configuration.

version = "1"

[[contracts]]
name = "sentinel-token"
path = "contracts/token"
# Intended invariant templates for integration with Sentinel tooling.
invariants = ["balance_conservation", "no_overflow"]
fuzz_timeout_secs = 120
fuzz_iterations = 0

[[contracts]]
name = "sentinel-vault"
path = "contracts/vault"
invariants = ["access_control", "no_overflow"]
fuzz_timeout_secs = 60
